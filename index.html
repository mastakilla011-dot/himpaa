
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>himpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    min-height:100vh;
    background:#090909;
    color:white;
    font-family:'Manrope',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

body::before {
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:white;
    filter:blur(180px);
    opacity:.07;
    top:-180px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.container {
    width:100%;
    max-width:440px;
    position:relative;
    animation:appear 1s ease;
}

@keyframes appear {
    from { opacity:0; transform:translateY(25px); }
    to { opacity:1; transform:translateY(0); }
}

.top {
    margin-bottom:65px;
}

.logo-small {
    font-size:17px;
    letter-spacing:2px;
    font-weight:700;
}

h1 {
    font-size:clamp(75px,20vw,110px);
    font-weight:500;
    letter-spacing:-8px;
    line-height:1;
    font-family:'Playfair Display',serif;
    font-style:italic;
}

.hero { margin-bottom:45px; }

.subtitle {
    margin-top:20px;
    color:#888;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
}

.description {
    margin-top:13px;
    color:#aaa;
    font-size:14px;
    line-height:1.8;
}

.section-title {
    color:#666;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:15px;
    text-transform:uppercase;
}

.links {
    display:flex;
    flex-direction:column;
    gap:12px;
}

.link {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:21px 22px;
    border:1px solid #292929;
    border-radius:12px;
    text-decoration:none;
    color:white;
    background:#111;
    transition:.3s ease;
}

.link:hover {
    background:#1c1c1c;
    border-color:#777;
    transform:translateY(-3px);
}

.link-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.icon {
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#202020;
    border-radius:10px;
    font-size:17px;
}

.link-name { font-size:14px; font-weight:600; }

.link-desc {
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.arrow { color:#888; font-size:19px; }

footer {
    text-align:center;
    margin-top:65px;
    color:#444;
    font-size:10px;
    letter-spacing:2px;
}

@media(max-width:400px) {
    h1 { letter-spacing:-6px; }
}
</style>
</head>

<body>
<main class="container">

    <div class="top">
        <div class="logo-small">h.</div>
    </div>

    <section class="hero">
        <h1>himpa</h1>
        <div class="subtitle">Coder / Vibecoder / Web3</div>
        <p class="description">
            Создаю цифровые проекты, изучаю технологии
            и исследую возможности Web3.
        </p>
    </section>

    <div class="section-title">MY LINKS</div>

    <div class="links">

        <a class="link" href="https://t.me/himpahere" target="_blank" rel="noopener noreferrer">
            <div class="link-left">
                <div class="icon">↗</div>
                <div>
                    <div class="link-name">Telegram channel</div>
                    <div class="link-desc">Crypto · NFT · Giveaways</div>
                </div>
            </div>
            <div class="arrow">↗</div>
        </a>

        <a class="link" href="https://t.me/himparep" target="_blank" rel="noopener noreferrer">
            <div class="link-left">
                <div class="icon">✳</div>
                <div>
                    <div class="link-name">Reviews</div>
                    <div class="link-desc">Отзывы и репутация</div>
                </div>
            </div>
            <div class="arrow">↗</div>
        </a>

    </div>

    <footer>
        © 2026 HIMPA · ALL RIGHTS RESERVED
    </footer>

</main>
</body>
</html>
